    <!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dildar Magsi AI</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
#header{background:#075e54;padding:15px;text-align:center;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:10px}
.msg{max-width:80%;padding:10px;margin:8px;border-radius:12px}
.user{background:#128c7e;margin-left:auto}
.ai{background:#2a2f32;margin-right:auto}
#box{display:flex;padding:10px;background:#202c33}
input{flex:1;padding:12px;border-radius:25px;border:none}
button{margin-right:8px;background:#128c7e;border:none;color:#fff;padding:12px 18px;border-radius:50%}
#googleView{display:none;flex:1;background:#fff}
#googleView iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>
<div id="header">Dildar Magsi AI</div>
<div id="chat">
<div class="msg ai">السلام علیکم! کچھ بھی لکھو، میں گوگل پر سرچ کر دوں گا۔</div>
</div>

<div id="googleView">
<div style="background:#202c33;padding:8px;display:flex;justify-content:space-between">
<span>گوگل رزلٹ</span>
<button onclick="closeGoogle()" style="background:red">X بند کرو</button>
</div>
<iframe id="gframe" src=""></iframe>
</div>

<div id="box">
<input id="inp" placeholder="یہاں لکھیں...">
<button onclick="send()">➤</button>
</div>

<script>
function send(){
 let t = document.getElementById('inp').value.trim();
 if(!t) return;
 let chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg user">${t}</div>`;
 document.getElementById('inp').value='';

 let reply = `ٹھیک ہے، میں "${t}" گوگل پر سرچ کر رہا ہوں`;
 chat.innerHTML += `<div class="msg ai">${reply}</div>`;

 // اندر ہی گوگل کھولنا
 document.getElementById('googleView').style.display='flex';
 document.getElementById('gframe').src = "https://www.google.com/search?q="+encodeURIComponent(t)+"&igu=1";
 chat.scrollTop = chat.scrollHeight;
}
function closeGoogle(){
 document.getElementById('googleView').style.display='none';
 document.getElementById('gframe').src='';
}
</script>
</body>
</html>
