<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dildar Magsi AI</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}#header{background:#075e54;padding:15px;text-align:center}#chat{flex:1;overflow-y:auto;padding:10px}.msg{max-width:80%;padding:10px;margin:8px;border-radius:12px}.user{background:#128c7e;margin-left:auto}.ai{background:#2a2f32;margin-right:auto}#box{display:flex;padding:10px;background:#202c33}input{flex:1;padding:12px;border-radius:25px;border:none}#googleView{display:none;flex:1;flex-direction:column;background:#fff}#googleView iframe{width:100%;height:100%;border:none}</style>
</head>
<body>
<div id="header">Dildar Magsi AI - گوگل سرچ اندر</div>
<div id="chat"><div class="msg ai">سلام دلدار بھائی! کچھ بھی لکھو میں اندر ہی سرچ کر دوں گا۔</div></div>
<div id="googleView"><div style="background:#202c33;padding:8px;display:flex;justify-content:space-between"><span>گوگل رزلٹ</span><button onclick="document.getElementById('googleView').style.display='none'" style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px">X بند کرو</button></div><iframe id="gframe" src=""></iframe></div>
<div id="box"><input id="inp" placeholder="یہاں لکھیں..."><button onclick="send()" style="margin-right:8px;background:#128c7e;border:none;color:#fff;padding:12px 18px;border-radius:50%">➤</button></div>
<script>
function send(){
 let t=document.getElementById('inp').value.trim(); if(!t) return;
 let c=document.getElementById('chat'); c.innerHTML+=`<div class="msg user">${t}</div>`;
 document.getElementById('inp').value=''; c.innerHTML+=`<div class="msg ai">ٹھیک ہے، "${t}" سرچ کر رہا ہوں</div>`;
 document.getElementById('googleView').style.display='flex';
 document.getElementById('gframe').src="https://www.google.com/search?q="+encodeURIComponent(t)+"&igu=1";
 c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
